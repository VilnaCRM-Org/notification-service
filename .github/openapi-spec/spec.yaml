openapi: 3.1.0
info:
  title: VilnaCRM Notification Service API
  description: This API provides endpoints to manage VilnaCRM Notification Service data within VilnaCRM.
  contact:
    name: VilnaCRM Support
    url: https://github.com/VilnaCRM-Org/notification-service
    email: support@vilnacrm.com
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
  version: 2.0.0
servers:
- url: /
  description: Current host
paths:
  /api/event-types:
    get:
      tags:
      - EventStream
      summary: Retrieves the collection of EventType resources.
      description: Returns one page of the subscribable event types, in byte order of their names.
      operationId: api_event_types_get
      parameters:
      - name: page
        in: query
        description: Page number, starting at 1.
        required: false
        schema:
          type: integer
          format: int32
          default: 1
          minimum: 1
      - name: itemsPerPage
        in: query
        description: Number of items per page.
        required: false
        schema:
          type: integer
          format: int32
          default: 30
          maximum: 100
          minimum: 1
      responses:
        '200':
          description: EventType collection
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '400':
          description: Invalid query parameter.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Validation failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/events/status:
    get:
      tags:
      - EventStream
      summary: Retrieves the event stream status.
      description: Returns how far the answering instance has read the event topic, its memory window and its subscribers. It reads only the state the instance holds and answers in every life stage.
      operationId: api_events_status_get
      responses:
        '200':
          description: EventStreamStatus resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStreamStatus'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/health:
    get:
      tags:
      - HealthCheck
      summary: Checks the health of the service.
      description: Returns 204 when the cache and the message broker respond and the event stream of the node is ready. Returns a 500 problem document that lists every failing dependency otherwise.
      operationId: api_health_get
      responses:
        '204':
          description: Health check passed with no content to return.
        '500':
          description: Health check failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          description: Problem response.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    DependencyFailure:
      type: object
      description: One dependency that did not answer its probe.
      required:
      - dependency
      - message
      properties:
        dependency:
          type: string
          description: '`cache`, `message_broker` or `event_stream`.'
        message:
          type: string
          description: Failure message of the probe.
    EventStreamStatus:
      type: object
      description: |-
        The status of the event stream on the answering instance: its reader, its memory window and
        its subscribers. The 64-bit counters and positions are decimal strings; an unknown value is
        `null`.
      required:
      - state
      - reason
      - brokerReachable
      - position
      - endOffset
      - lag
      - windowFirst
      - windowLast
      - subscribers
      - rejectedRecords
      - retentionLosses
      - replayCapped
      properties:
        brokerReachable:
          type: boolean
          description: Whether the last read of the topic watermarks succeeded.
        endOffset:
          type:
          - string
          - 'null'
          description: End of the topic at the last successful watermark read; `null` before it.
          example: '42'
        lag:
          type:
          - string
          - 'null'
          description: Events between the position and the end of the topic; `null` while either is unknown.
          example: '0'
        position:
          type:
          - string
          - 'null'
          description: Id of the last event read from the topic; `null` before the first read.
          example: '42'
        reason:
          type:
          - string
          - 'null'
          description: |-
            Why the service is not ready yet, only while starting: `broker-unreachable`,
            `topic-not-found`, `partition-count` or `catching-up`.
          example: catching-up
        rejectedRecords:
          type: string
          description: Invalid records skipped by the reader.
          example: '0'
        replayCapped:
          type: string
          description: Replays that reached their cap.
          example: '0'
        retentionLosses:
          type: string
          description: Jumps to the start of the topic because retention removed unread events.
          example: '0'
        state:
          type: string
          description: 'Life stage: `starting`, `ready` or `shutting-down`.'
          example: ready
        subscribers:
          type: integer
          description: Number of open subscriptions served here.
          example: 0
          minimum: 0
        windowFirst:
          type:
          - string
          - 'null'
          description: 'Floor of the memory window: events after it can be resumed from memory.'
          example: '0'
        windowLast:
          type:
          - string
          - 'null'
          description: Id of the newest event held in the memory window.
          example: '42'
    EventType:
      type: object
      description: A subscribable event type.
      required:
      - name
      properties:
        name:
          type: string
          description: Name of the event type.
          example: user.created
          maxLength: 128
          minLength: 1
          pattern: ^[a-z][a-z0-9]*([._-][a-z0-9]+)*$
    Problem:
      type: object
      description: An RFC 9457 problem document.
      required:
      - type
      - title
      - status
      properties:
        detail:
          type:
          - string
          - 'null'
          description: Explanation specific to this occurrence.
        failures:
          type: array
          items:
            $ref: '#/components/schemas/DependencyFailure'
          description: Failed probes, for `/problems/dependency-unavailable`.
        status:
          type: integer
          format: int32
          description: HTTP status code.
          maximum: 599
          minimum: 100
        title:
          type: string
          description: Canonical reason phrase of the status.
        type:
          type: string
          description: '`about:blank` or a relative URI reference.'
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
          description: Violated constraints, for `/problems/validation-failed`.
    Violation:
      type: object
      description: One violated constraint.
      required:
      - propertyPath
      - message
      - code
      properties:
        code:
          type: string
          description: Stable code of the violated constraint.
        message:
          type: string
          description: Human-readable explanation.
        propertyPath:
          type: string
          description: Wire name of the invalid field.
tags:
- name: EventStream
  description: Event catalog and event stream status endpoints.
- name: HealthCheck
  description: Runtime health-check endpoints.
