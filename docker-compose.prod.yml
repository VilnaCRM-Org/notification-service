# Run with an explicit env file so that the committed development .env is not read:
#   docker compose --env-file /etc/service/prod.env -f docker-compose.yml -f docker-compose.prod.yml up --detach --wait
services:
  app:
    # No dependency: the base dependencies on localstack and kafka belong to the inactive profile local.
    depends_on: !reset null
    environment:
      APP_ENV: prod
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_ENDPOINT_URL_SQS: !reset null # real SQS through the default credential chain
      AWS_ACCESS_KEY_ID: !reset null
      AWS_SECRET_ACCESS_KEY: !reset null
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      MAX_SUBSCRIBERS: ${MAX_SUBSCRIBERS:-5000} # production reference cap (NFR-9)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
          pids: 256
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  localstack:
    profiles: [local]

  kafka:
    profiles: [local]
